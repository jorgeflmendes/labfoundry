site_name: LabFoundry
site_description: Deterministic procedural cyber-range scenarios and network evidence on GNS3
site_author: LabFoundry contributors


docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

watch:
  - src/labfoundry

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - Overview: guide/index.md
      - Scenario authoring: guide/scenario-authoring.md
      - Guest execution: guide/guest-execution.md
      - VirtualBox: guide/virtualbox.md
      - Incus: guide/incus.md
      - Real-world egress: guide/real-world-egress.md
      - Captures and evidence: guide/captures.md
      - Lab realism guidelines: guide/lab-realism-guidelines.md
  - Advanced:
      - Overview: advanced/index.md
      - Architecture: advanced/architecture.md
      - GNS3 API contract: advanced/gns3-api-contract.md
  - Reference:
      - Overview: reference/index.md
      - CLI: reference/cli.md
      - Scenario DSL: reference/scenario-dsl.md
      - Guest bootstrap: reference/guest-bootstrap.md
      - Exceptions: reference/exceptions.md
      - Python API:
          - Overview: reference/api/index.md
          - Schema: reference/api/schema.md
          - Compiler: reference/api/compiler.md
          - Runtime: reference/api/runtime.md
          - Traffic: reference/api/traffic.md
          - Evidence: reference/api/evidence.md
          - Guest control: reference/api/guest.md
          - GNS3 backend: reference/api/gns3.md
          - Ground truth: reference/api/groundtruth.md
          - Utilities: reference/api/utilities.md
          - CLI implementation: reference/api/cli.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Releasing: development/releasing.md


theme:
  name: material
  logo: assets/labfoundry-logo.png
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members_order: source
            inherited_members: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; LabFoundry contributors
